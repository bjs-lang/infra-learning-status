name: Sync learning status
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['sync.py', 'test_sync.py', '.github/workflows/sync.yml', 'index.html']
permissions: {}
concurrency:
  group: learning-status-mirror
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test approved public projection
        run: python3 -m unittest -v test_sync.py
      - name: Read current website data
        run: python3 sync.py
      - name: Save only generated public summaries
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add learning-status.json learning-status.md
          if ! git diff --cached --quiet; then
            git commit -m 'Update public learning status'
            git push
          fi
      - name: Prepare minimal public artifact
        run: |
          mkdir _site
          cp learning-status.json learning-status.md index.html _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
  deploy:
    needs: sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified current summary
        id: deployment
        uses: actions/deploy-pages@v4
